<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">IntentCart architecture</title>
<desc id="desc">A flow from buyer intent through untrusted AI recommendation into trusted catalogue validation, deterministic policy, authoritative cart, approval, atomic checkout claim, test order provider and audit trail.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <style>
    .title{font:700 30px Inter,Arial,sans-serif;fill:#0f172a}.label{font:600 16px Inter,Arial,sans-serif;fill:#0f172a}.small{font:500 13px Inter,Arial,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.trusted{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.untrusted{fill:#fff7ed;stroke:#fb923c;stroke-width:2}.accent{fill:#eef2ff;stroke:#818cf8;stroke-width:2}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#f97316;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1400" height="760" fill="#ffffff"/>
<text x="70" y="68" class="title">IntentCart — bounded agentic commerce</text>
<text x="70" y="98" class="small">The model recommends. The server validates, prices, approves and executes.</text>

<rect x="40" y="145" width="1320" height="230" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
<text x="70" y="183" class="label">UNTRUSTED / MODEL-INFLUENCED ZONE</text>
<text x="70" y="207" class="small">Treat recommendation output as data, never as authority.</text>

<rect x="70" y="245" width="210" height="82" rx="14" class="box"/><text x="175" y="278" text-anchor="middle" class="label">Buyer intent</text><text x="175" y="301" text-anchor="middle" class="small">natural language request</text>
<rect x="355" y="245" width="230" height="82" rx="14" class="untrusted"/><text x="470" y="278" text-anchor="middle" class="label">Recommendation API</text><text x="470" y="301" text-anchor="middle" class="small">LLM or deterministic fallback</text>
<rect x="660" y="245" width="250" height="82" rx="14" class="untrusted"/><text x="785" y="278" text-anchor="middle" class="label">AI recommendation</text><text x="785" y="301" text-anchor="middle" class="small">product IDs + quantities + reasons</text>
<path d="M280 286H350" class="line"/><path d="M585 286H655" class="line"/>

<rect x="40" y="405" width="1320" height="290" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
<text x="70" y="443" class="label">TRUSTED COMMERCE BOUNDARY</text>

<rect x="70" y="485" width="220" height="82" rx="14" class="trusted"/><text x="180" y="518" text-anchor="middle" class="label">Catalogue validation</text><text x="180" y="541" text-anchor="middle" class="small">IDs, quantities, availability</text>
<rect x="345" y="485" width="220" height="82" rx="14" class="trusted"/><text x="455" y="518" text-anchor="middle" class="label">Policy engine</text><text x="455" y="541" text-anchor="middle" class="small">budget, stock, delivery</text>
<rect x="620" y="485" width="220" height="82" rx="14" class="accent"/><text x="730" y="518" text-anchor="middle" class="label">Authoritative cart</text><text x="730" y="541" text-anchor="middle" class="small">server price + cart version</text>
<rect x="895" y="485" width="180" height="82" rx="14" class="trusted"/><text x="985" y="518" text-anchor="middle" class="label">Buyer approval</text><text x="985" y="541" text-anchor="middle" class="small">exact version</text>
<rect x="1130" y="485" width="180" height="82" rx="14" class="accent"/><text x="1220" y="518" text-anchor="middle" class="label">Checkout claim</text><text x="1220" y="541" text-anchor="middle" class="small">atomic + idempotent</text>

<path d="M785 327V420H180V480" class="dash"/>
<path d="M290 526H340" class="line"/><path d="M565 526H615" class="line"/><path d="M840 526H890" class="line"/><path d="M1075 526H1125" class="line"/>

<rect x="1130" y="610" width="180" height="58" rx="12" class="box"/><text x="1220" y="634" text-anchor="middle" class="label">Test order provider</text><text x="1220" y="653" text-anchor="middle" class="small">uncertain outcomes reconciled</text>
<path d="M1220 568V605" class="line"/>

<rect x="895" y="610" width="180" height="58" rx="12" class="box"/><text x="985" y="634" text-anchor="middle" class="label">D1 persistence</text><text x="985" y="653" text-anchor="middle" class="small">sessions · carts · orders</text>
<path d="M730 568V590H985V605" class="line"/><path d="M1220 568V590H985V605" class="line"/>

<rect x="620" y="610" width="220" height="58" rx="12" class="box"/><text x="730" y="634" text-anchor="middle" class="label">Audit trail</text><text x="730" y="653" text-anchor="middle" class="small">one trace across decisions</text>
<path d="M985 668V690H730V673" class="line"/>

<text x="70" y="735" class="small">Key invariant: checkout never trusts a client-supplied amount; it reloads the cart and recalculates before creating an order.</text>
</svg>